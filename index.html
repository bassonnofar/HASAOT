<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הסעות עיינות</title>
<meta name="theme-color" content="#1f4e5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הסעות עיינות">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fff; --ink:#1d2a30; --mute:#6b7a80; --line:#e4ded2;
  --pri:#1f4e5f; --pri2:#2c6e84; --ok:#2e8b57; --okbg:#e3f3ea; --bad:#c0392b; --badbg:#fbe6e3;
  --warn:#d68910; --warnbg:#fdf1dc; --info:#2e6fb7; --infobg:#e5effa; --grey:#eef0f0;
  --r:16px; --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}
header.top{position:sticky;top:0;z-index:50;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top h1{font-size:18px;margin:0;font-weight:800;flex:1}
header.top .sub{font-size:12px;opacity:.85;font-weight:400}
header.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 8px;font-weight:700}
.card h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--mute);font-size:14px}
.small{font-size:13px}
.big{font-size:28px;font-weight:800;line-height:1.15}
.row{display:flex;align-items:center;gap:8px}
.row.wrap2{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--grey);color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.out{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px;border-radius:10px}
.btn.xs{padding:4px 8px;min-height:32px;font-size:13px;border-radius:9px;font-weight:600}
.btn[disabled]{opacity:.5}
.btns{display:grid;gap:8px}
.btns.c2{grid-template-columns:1fr 1fr}.btns.c3{grid-template-columns:1fr 1fr 1fr}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--pri2)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--grey);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:#a5680a}.pill.info{background:var(--infobg);color:var(--info)}
.pill.dark{background:var(--pri);color:#fff}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.banner.info{background:var(--infobg);color:#1c4f87}.banner.warn{background:var(--warnbg);color:#8a5506}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:#1f6b42}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.kid{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kid:last-child{border-bottom:0}
.kid .nm{flex:1;min-width:0;font-weight:600}
.kid .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.stops{position:relative;margin:6px 0 0;padding:0}
.stop{display:flex;gap:10px;align-items:flex-start;padding:6px 0;position:relative}
.stop .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:#fff;flex:none;margin-top:3px;z-index:1}
.stop.passed .dot{background:var(--ok);border-color:var(--ok)}
.stop.now .dot{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 5px rgba(214,137,16,.2)}
.stop.mine .nm2{font-weight:800}
.stops:before{content:"";position:absolute;right:7px;top:12px;bottom:12px;width:2px;background:var(--line)}
.stop .nm2{flex:1}
.stop .tm{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;border:0;background:none;padding:6px 2px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bottom button .ic{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--pri);font-weight:700}
nav.bottom .badge{position:absolute;top:0;left:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding-bottom:2px}
.tabs button{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap;box-shadow:var(--sh)}
.tabs button.on{background:var(--pri);color:#fff}
.alert{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:12px;margin:0 0 6px;font-size:14px}
.alert.red{background:var(--badbg)}.alert.orange{background:var(--warnbg)}.alert.blue{background:var(--infobg)}
.alert .t{flex:1;min-width:0}
.alert .t b{display:block;font-size:12px;color:var(--mute);font-weight:600}
.line-card{border-right:6px solid var(--pri2)}
.line-card.arrived{border-right-color:var(--ok)}.line-card.route{border-right-color:var(--warn)}
.prog{height:8px;background:var(--grey);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--mute);font-weight:500}
.map{height:240px;border-radius:14px;overflow:hidden;margin-top:8px;z-index:1}
.map.tall{height:calc(100vh - 220px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal .mh h2{margin:0;font-size:19px}
.x{border:0;background:var(--grey);border-radius:50%;width:36px;height:36px;font-size:18px}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1d2a30;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-size:15px;max-width:90vw;text-align:center}
.center{text-align:center}
.hero{padding:26px 16px;text-align:center}
.hero .emoji{font-size:54px}
.search{position:sticky;top:64px;z-index:5;background:var(--bg);padding:6px 0}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:0 0 6px}
.pick.taken{opacity:.55}
.sel{border-color:var(--pri2);background:var(--infobg)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:4px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th{color:var(--mute);font-weight:500}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.hr{height:1px;background:var(--line);margin:12px 0}
.empty{padding:26px 10px;text-align:center;color:var(--mute)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
/* ===================== הגדרות ===================== */
// להדביק כאן את כתובת ה-Web App של Apps Script (נגמרת ב-/exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbz5jlh-JUGblK46cCMq8KdWPsikwY805RMjx2ODuwu-zTWB5dQv4EvbCPlGfdr3G5YhOw/exec';
const APP_URL = location.origin + location.pathname;
const VILLAGE = 'כפר עיינות';

/* ===================== כלים ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) { } } };
const hm = ms => ms ? new Date(ms).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';
const ago = ms => { if (!ms) return ''; const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'עכשיו' : m < 60 ? `לפני ${m} דק׳` : `לפני ${Math.floor(m / 60)} שע׳`; };
const telLink = p => 'tel:' + String(p || '').replace(/\D/g, '');
const waLink = (p, text) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '972' + d.slice(1); return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; };
const fmtPhone = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3) : d; };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

async function api(action, data = {}) {
  if (API_URL.startsWith('PASTE')) throw new Error('המערכת עוד לא חוברה לשרת (API_URL)');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data)), redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'שגיאה'); e.code = j.error; throw e; }
  return j;
}
async function act(btn, fn) {
  if (btn) { btn.disabled = true; btn._t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); }
  catch (e) { if (e.code === 'AUTH') return logout(true); toast(e.message || 'שגיאה'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn._t; } }
}

/* ---------- סטטוסים ---------- */
const ST = {
  none: { t: 'לא דווח', c: '' }, here: { t: 'בתחנה', c: 'info' }, late: { t: 'מאחר/ת', c: 'warn' },
  cancel: { t: 'לא נוסע/ת', c: '' }, on: { t: 'עלה/תה ✓', c: 'ok' }, no: { t: 'לא הגיע/ה ✗', c: 'bad' }
};
const stPill = s => { const d = ST[s.s] || ST.none; return `<span class="pill ${d.c}">${d.t}${s.s === 'late' && s.mins ? ' ' + s.mins + '׳' : ''}</span>`; };
const LINE_ST = { wait: ['טרם יצא', ''], route: ['בדרך', 'warn'], arrived: ['הגיע לכפר', 'ok'] };

/* ---------- מודאל ---------- */
function openModal(title, html, onMount) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-bg"><div class="modal"><div class="mh"><h2>${title}</h2><button class="x" data-close>✕</button></div><div id="mbody">${html}</div></div></div>`;
  m.querySelector('[data-close]').onclick = closeModal;
  m.querySelector('.modal-bg').onclick = e => { if (e.target.classList.contains('modal-bg')) closeModal(); };
  if (onMount) onMount($('#mbody'));
}
function closeModal() { $('#modal').innerHTML = ''; }
const modalOpen = () => !!$('#modal .modal');

/* ---------- מפות ---------- */
const maps = {};
function busIcon(label, fresh) {
  return L.divIcon({ className: '', iconSize: null, html: `<div style="transform:translate(50%,-50%);background:${fresh ? '#d68910' : '#8a9599'};color:#fff;border-radius:12px;padding:3px 8px;font:700 13px Heebo;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">🚌 ${esc(label)}</div>` });
}
function drawMap(id, points) {
  const el = document.getElementById(id);
  if (!el || !window.L) return;
  let m = maps[id];
  if (!m || m._container !== el) {
    m = maps[id] = L.map(el, { zoomControl: true, attributionControl: false }).setView([31.8, 34.9], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(m);
    m._lay = L.layerGroup().addTo(m);
  }
  m._lay.clearLayers();
  const b = [];
  points.forEach(p => { L.marker([p.lat, p.lng], { icon: busIcon(p.label, p.fresh) }).addTo(m._lay); b.push([p.lat, p.lng]); });
  if (b.length === 1) m.setView(b[0], 13); else if (b.length) m.fitBounds(b, { padding: [40, 40] });
  setTimeout(() => m.invalidateSize(), 50);
}

/* ---------- סקר (polling) ---------- */
let pollT = null, pollFn = null, pollMs = 30000;
function startPoll(fn, ms) { pollFn = fn; pollMs = ms; clearTimeout(pollT); tick(); }
async function tick() {
  clearTimeout(pollT);
  if (!pollFn) return;
  if (document.visibilityState === 'visible') { try { await pollFn(); } catch (e) { } }
  pollT = setTimeout(tick, pollMs);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pollFn) tick(); });

/* =====================================================================
   אפליקציית החניכים
   ===================================================================== */
const K = { me: null, roster: null, pick: null, respMode: LS.get('hs_resp') === '1', gps: null, lastPos: 0, wake: null };

function kidHeader(sub) {
  return `<header class="top"><div style="flex:1"><h1>🚌 הסעות ${VILLAGE}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
  <button onclick="kidRefresh(this)" aria-label="רענון">⟳</button></header>`;
}
async function kidInit() {
  document.title = 'הסעות ' + VILLAGE;
  $('#app').innerHTML = kidHeader() + `<div class="wrap"><div class="empty"><span class="spin"></span></div></div>`;
  startPoll(kidLoad, 30000);
}
async function kidRefresh(btn) { await act(btn, kidLoad); }
async function kidLoad() {
  const token = LS.get('hs_token');
  if (!token) { K.me = { registered: false }; return kidRender(); }
  try { K.me = await api('me', { token }); }
  catch (e) { if (!K.me) $('#app').innerHTML = kidHeader() + `<div class="wrap"><div class="banner bad">${esc(e.message)}</div></div>`; return; }
  if (!K.me.registered) LS.set('hs_token', null);
  pollMs = (K.me.isResp && K.respMode) ? 15000 : 30000;
  if (!K.me.isResp && K.gps) stopGps();
  kidRender();
}
function kidRender() {
  if (modalOpen()) return;
  const d = K.me;
  if (!d.registered) return kidWelcome();
  if (d.status === 'pending') {
    $('#app').innerHTML = kidHeader() + `<div class="wrap"><div class="card hero"><div class="emoji">⏳</div><h2>הבקשה שלך ממתינה לאישור</h2>
    <p class="muted">השם ${esc(d.me.name)} ${esc(d.me.group)} כבר רשום ממכשיר אחר, אז צוות הכפר צריך לאשר את ההרשמה.<br>אחרי האישור המסך יתעדכן לבד.</p>
    <button class="btn sec" onclick="kidStartRegister()">טעיתי בשם — בחירה מחדש</button></div></div>`;
    return;
  }
  if (K.respMode && d.isResp) return respRender();
  let h = kidHeader(d.me.name + ' · ' + d.me.group) + '<div class="wrap">';
  if (d.day && d.day.announce) h += `<div class="banner info">📢 ${esc(d.day.announce.text)}</div>`;
  if (!d.day) {
    h += `<div class="card hero"><div class="emoji">🌙</div><h2>עוד לא נפתח יום הסעות</h2><p class="muted">ביום ההסעה יופיעו כאן התחנה שלך, השעה, ומי האחראי/ת בהסעה.</p></div>`;
    h += kidDetailsCard();
    $('#app').innerHTML = h + '</div>'; return;
  }
  if (!d.onList) {
    h += `<div class="card hero"><div class="emoji">🔎</div><h2>לא מצאנו אותך ברשימת ההסעות של היום</h2>
    <p class="muted">אם את/ה אמור/ה לנסוע — דבר/י עם המדריך/ה. ייתכן שהשם שלך כתוב השבוע קצת אחרת.</p>
    <button class="btn out block" onclick="kidStartRegister(true)">אני ברשימה בשם אחר</button></div>`;
    h += kidDetailsCard();
    $('#app').innerHTML = h + '</div>'; return;
  }
  const l = d.line, st = d.station, my = d.my;
  if (l.msg) h += `<div class="banner warn">📢 ${esc(l.line || l.name)}: ${esc(l.msg.text)}</div>`;
  if (d.isResp) h += d.isBackup ? `<button class="btn block sec" style="margin-bottom:12px" onclick="setRespMode(true)">את/ה המחליף/ה של האחראי/ת — למסך האחראי/ת (רק אם התבקשת)</button>`
    : `<button class="btn block warn" style="margin-bottom:12px" onclick="setRespMode(true)">⭐ את/ה האחראי/ת בהסעה — למסך האחראי/ת</button>`;

  // סטטוס אישי
  if (my.s === 'on') h += `<div class="banner ok">✅ סומנת כמי שעלה/תה להסעה. נסיעה טובה!</div>`;
  if (my.s === 'no') h += `<div class="banner bad">סומנת כמי שלא הגיע/ה לתחנה. אם זו טעות — התקשר/י לאחראי/ת.</div>`;

  // כרטיס התחנה
  h += `<div class="card"><div class="muted">${esc(l.name)}</div>
    <div class="spread" style="margin-top:4px"><div class="grow"><div class="muted small">התחנה שלך</div><div class="big">${esc(st.name)}</div></div>
    <div class="center"><div class="muted small">איסוף</div><div class="big">${esc(st.time)}</div></div></div>
    ${st.note ? `<div class="banner info" style="margin:10px 0 0">📍 איפה לחכות: ${esc(st.note)}</div>` : ''}
    ${st.mapUrl ? `<a class="btn sec sm" style="margin-top:8px" href="${esc(st.mapUrl)}" target="_blank" rel="noopener">פתיחת התחנה במפה</a>` : ''}
  </div>`;

  // כפתורי דיווח
  if (my.s !== 'on' && l.state !== 'arrived') {
    const cur = my.s;
    h += `<div class="card"><h2>דיווח לאחראי/ת</h2>
      ${cur !== 'none' && cur !== 'no' ? `<div class="spread" style="margin-bottom:10px"><div>הדיווח שלך: ${stPill(my)} <span class="muted small">${hm(my.ts)}</span></div><button class="btn xs sec" onclick="kidReport(this,'clear')">ביטול</button></div>` : ''}
      <div class="btns c2">
        <button class="btn ok" onclick="kidReport(this,'here')">📍 אני בתחנה</button>

function startGps() {

  }, e => { toast('אין הרשאת מיקום — יש לאשר בדפדפן'); stopGps(); }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });

      const p = await api('preview', { session: A.s, tab: $('#tb').value });
      $('#pv').innerHTML = `<div class="card"><div class="spread"><b>נמצאו ${p.lines.length} קווים, ${p.total} חניכים</b>${p.unregistered ? `<span class="pill warn">${p.unregistered} לא רשומים</span>` : ''}</div>
        ${p.lines.map(l => `<div style="margin-top:10px"><b>${esc(l.name)}</b> <span class="muted">(${l.kids})</span><div class="muted small">${l.stations.map(s => esc(s.time) + ' ' + esc(s.name) + ' (' + s.kids + ')').join(' · ')}</div></div>`).join('')}
        ${p.warnings.length ? `<div class="banner warn" style="margin-top:10px">${p.warnings.map(esc).join('<br>')}</div>` : ''}</div>
        <p class="muted small">בדקו שהקווים והתחנות נקראו נכון. חניכים שיתווספו לטבלה אחר כך יופיעו אוטומטית.</p>
        ${A.data.day ? `<div class="banner warn">כבר פתוח יום (${esc(A.data.day.tab)}). פתיחה מחדש תשמור אותו להיסטוריה ותאפס את כל הסטטוסים.</div>` : ''}
        <button class="btn block ok" id="od">פתיחת היום</button>`;
      $('#od').onclick = e => act(e.target, async () => { await api('openDay', { session: A.s, tab: $('#tb').value, force: !!A.data.day }); closeModal(); toast('היום נפתח ✓'); A.tab = 'shift'; await adminLoad(); });
    };
    $('#tb').onchange = () => act(null, pv);
    await pv();
  });
}
function closeDayModal() {
  const L = A.data.lines;
  const notArr = L.filter(l => l.state !== 'arrived').map(l => l.name);
  openModal('סגירת יום הסעות', `${notArr.length ? `<div class="banner warn">עוד לא סומנו כמי שהגיעו לכפר: ${notArr.map(esc).join(', ')}</div>` : ''}
    <p>הסגירה שומרת את כל הסטטוסים להיסטוריה ומנקה את המסך לשבוע הבא. אחרי הסגירה תקבלו סיכום לשליחה בוואטסאפ.</p>
    <button class="btn bad block" id="cd">סגירת היום</button>`, b => {
    $('#cd', b).onclick = e => act(e.target, async () => {
      const r = await api('closeDay', { session: A.s });
      $('#mbody').innerHTML = `<div class="banner ok">היום נסגר ✓</div><textarea class="i" rows="12" id="sumt">${esc(r.text)}</textarea>
        <div class="btns c2" style="margin-top:8px"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(r.text)}" target="_blank">💬 שליחה בוואטסאפ</a><button class="btn sec" onclick="navigator.clipboard.writeText($('#sumt').value).then(()=>toast('הועתק'))">העתקה</button></div>`;
      await adminLoad();
    });
  });
}

/* ---------- טאב מפה ---------- */
function renderMapTab(m) {
  const d = A.data;
  if (!d.day) { m.innerHTML = '<div class="empty">אין יום פתוח</div>'; return; }
  const pts = d.lines.filter(l => l.pos).map(l => ({ lat: l.pos.lat, lng: l.pos.lng, label: l.name + ' · ' + ago(l.pos.ts), fresh: Date.now() - l.pos.ts < 4 * 60000 }));
  m.innerHTML = `<div class="card" style="padding:8px"><div id="amap" class="map tall"></div></div>
    ${d.lines.map(l => `<div class="spread small" style="padding:4px 6px"><span>${esc(l.name)}</span><span class="muted">${l.pos ? `<a href="https://www.google.com/maps?q=${l.pos.lat},${l.pos.lng}" target="_blank" rel="noopener">📍 ${ago(l.pos.ts)}</a>` : 'אין מיקום'}</span></div>`).join('')}
    ${pts.length ? '' : '<p class="muted center">המיקום מגיע מהטלפון של החניך/ה האחראי/ת כשהשיתוף פועל.</p>'}`;
  const draw = () => drawMap('amap', pts);
  if (window.L) draw(); else window.addEventListener('load', draw, { once: true });
}

/* ---------- טאב חניכים ---------- */
function renderKidsTab(m) {
  const d = A.data;
  let h = '';
  h += `<div class="card"><h2>בקשות הרשמה ממתינות (${d.pending.length})</h2>` + (d.pending.length ? d.pending.map(p => `<div class="kid"><div class="nm">${esc(p.name)} · ${esc(p.group)}<small>טלפון בבקשה: ${fmtPhone(p.phone)}${p.curPhone ? ' · רשום כרגע עם: ' + fmtPhone(p.curPhone) : ''}</small></div>
      <a class="btn xs sec" href="${telLink(p.phone)}">📞</a><button class="btn xs ok" onclick="approve(this,'${p.token}')">אישור</button><button class="btn xs sec" onclick="reject(this,'${p.token}')">דחייה</button></div>`).join('') + `<p class="muted small">אישור מחליף את המכשיר הקודם של החניך/ה. כדאי לוודא בטלפון שזה באמת הוא/היא.</p>` : '<div class="muted">אין בקשות</div>') + `</div>`;
  if (d.day) {
    const all = []; d.lines.forEach(l => l.stations.forEach(s => s.kids.forEach(k => all.push(Object.assign({ line: l.name, lineId: l.id, station: s.name }, k)))));
    const unreg = all.filter(k => !k.reg);
    const q = A.filter;
    const found = q ? all.filter(k => (k.raw + ' ' + k.station + ' ' + k.line).includes(q)) : [];
    h += `<div class="card"><h2>חיפוש חניך/ה בהסעות היום</h2><input class="i" id="kq" placeholder="🔍 שם, קבוצה או תחנה" value="${esc(q)}">
      ${found.map(k => `<div class="kid"><div class="nm">${esc(k.raw)}<small>${esc(k.line)} · ${esc(k.station)}</small></div>${stPill(k.st)}<button class="btn xs sec" onclick="kidMenu('${k.lineId}','${esc(k.key)}')">⋯</button></div>`).join('')}
      ${q && !found.length ? '<div class="muted small">לא נמצא</div>' : ''}</div>`;
    h += `<div class="card"><h2>לא רשומים לאפליקציה (${unreg.length})</h2><p class="muted small">מי שלא רשום/ה לא יכול/ה לדווח ולראות סטטוס. כדאי שהמדריכים ישלחו להם את הקישור.</p>
      <button class="btn sm sec" onclick="navigator.clipboard.writeText('${esc(APP_URL)}').then(()=>toast('הקישור הועתק'))">העתקת קישור ההרשמה</button>
      ${unreg.map(k => `<div class="small" style="padding:4px 0">${esc(k.raw)} <span class="muted">· ${esc(k.line)}</span></div>`).join('')}</div>`;
  }
  m.innerHTML = h;
  const kq = $('#kq');
  if (kq) { kq.oninput = () => { A.filter = kq.value; const p = kq.selectionStart; renderKidsTab(m); const n = $('#kq'); n.focus(); n.setSelectionRange(p, p); }; }
}
async function approve(btn, token) { await act(btn, async () => { await api('approve', { session: A.s, token }); toast('אושר ✓'); await adminLoad(); }); }
async function reject(btn, token) { if (!confirm('לדחות את הבקשה?')) return; await act(btn, async () => { await api('reject', { session: A.s, token }); await adminLoad(); }); }

/* ---------- טאב אירועים ---------- */
const EVT = { here: '📍 הגיע/ה לתחנה', late: '⏱ מאחר/ת', cancel: '🚫 לא נוסע/ת', noshow: '✗ לא הגיע/ה', depart: '🚌 יצאה מתחנה', arrive: '🏡 הגיעה לכפר', pending: '👤 בקשת הרשמה' };
function renderEvents(m) {
  const ev = A.data.events || [];
  m.innerHTML = `<div class="card"><h2>אירועים אחרונים</h2>${ev.length ? `<ul class="list">${ev.map(e => `<li class="spread"><div><b>${EVT[e.t] || e.t}</b> ${esc(e.name || '')}${e.t === 'late' ? ' ' + e.mins + ' דק׳' : ''}<div class="muted small">${esc(e.line || '')}${e.st ? ' · ' + esc(e.st) : ''}</div></div><span class="muted small">${hm(e.ts)}</span></li>`).join('')}</ul>` : '<div class="muted">עוד אין אירועים</div>'}</div>`;
}

/* ---------- טאב ניהול (מנהלת ראשית) ---------- */
const SUBS = [['users', 'צוות'], ['stations', 'תחנות'], ['students', 'חניכים רשומים'], ['history', 'היסטוריה'], ['log', 'יומן פעולות'], ['settings', 'הגדרות']];
function renderAdminTab(m) {
  if (!isAdmin()) { m.innerHTML = '<div class="empty">אין הרשאה</div>'; return; }
  m.innerHTML = `<div class="tabs">${SUBS.map(s => `<button class="${A.sub === s[0] ? 'on' : ''}" onclick="adminSub('${s[0]}')">${s[1]}</button>`).join('')}</div><div id="sub"><div class="empty"><span class="spin"></span></div></div>`;
}
async function adminSub(s) {
  A.sub = s; renderAdminTab($('#main'));
  await act(null, async () => {
    const r = await api(s, { session: A.s });
    A.cache[s] = r;
    ({ users: subUsers, stations: subStations, students: subStudents, history: subHistory, log: subLog, settings: subSettings })[s]($('#sub'), r);
  });
}
function subUsers(el, r) {
  el.innerHTML = `<div class="card"><div class="spread"><h2>צוות ומנהלים תורנים</h2><button class="btn sm" onclick="userModal()">+ הוספה</button></div>
    ${r.users.map(u => `<div class="kid"><div class="nm">${esc(u.name)} ${u.role === 'admin' ? '<span class="pill dark">ראשי</span>' : '<span class="pill">תורן/ית</span>'} ${u.active ? '' : '<span class="pill bad">מושבת</span>'}<small>${fmtPhone(u.phone)}</small></div>
    <button class="btn xs sec" onclick="userModal('${u.id}')">עריכה</button></div>`).join('')}
    <p class="muted small">מנהל/ת תורן/ית רואה את מסך המשמרת, המפה, החניכים והאירועים — בלי טאב הניהול. נכנסים עם טלפון + קוד אישי.</p></div>`;
}
function userModal(id) {
  const u = id ? A.cache.users.users.find(x => x.id === id) : { name: '', phone: '', role: 'duty', active: true };
  openModal(id ? 'עריכת משתמש' : 'משתמש חדש', `<label class="f">שם</label><input class="i" id="un" value="${esc(u.name)}">
    <label class="f">טלפון (משמש לכניסה)</label><input class="i" id="up" type="tel" value="${esc(u.phone)}">
    <label class="f">הרשאה</label><select class="i" id="ur"><option value="duty" ${u.role !== 'admin' ? 'selected' : ''}>מנהל/ת תורן/ית</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>מנהל/ת ראשי/ת (הכל)</option></select>
    <label class="f">${id ? 'קוד חדש (להשאיר ריק כדי לא לשנות)' : 'קוד כניסה (4-8 ספרות)'}</label><input class="i" id="uc" inputmode="numeric" placeholder="${id ? '••••' : ''}">
    ${id ? `<label class="chk"><input type="checkbox" id="ua" ${u.active ? 'checked' : ''}><span>פעיל/ה</span></label>` : ''}
    <button class="btn block" style="margin-top:12px" id="us">שמירה</button>
    ${id ? `<button class="btn sec block" style="margin-top:8px" id="ud">מחיקה</button>` : ''}
    <p class="muted small">אחרי השמירה — שלחו לו/ה את הקישור <b>${esc(APP_URL)}#admin</b> ואת הקוד.</p>`, b => {
    $('#us', b).onclick = e => act(e.target, async () => {
      await api('saveUser', { session: A.s, id: id || '', name: $('#un').value, phone: $('#up').value, role: $('#ur').value, pin: $('#uc').value, active: id ? $('#ua').checked : true });
      closeModal(); toast('נשמר ✓'); adminSub('users');
    });
    if (id) $('#ud', b).onclick = e => { if (confirm('למחוק את ' + u.name + '?')) act(e.target, async () => { await api('delUser', { session: A.s, id }); closeModal(); adminSub('users'); }); };
  });
}
function subStations(el, r) {
  el.innerHTML = `<div class="card"><h2>תחנות — איפה בדיוק מחכים</h2><p class="muted small">ההסבר והקישור למפה מופיעים לחניכים בתחנה שלהם. נשמר לפי שם התחנה, כך שזה נשאר משבוע לשבוע.</p>
    ${r.stations.map((s, i) => `<div class="kid"><div class="nm">${esc(s.name)}<small>${esc(s.line)}${s.note ? ' · ' + esc(s.note) : ' · <span style="color:var(--warn)">אין הסבר</span>'}</small></div><button class="btn xs sec" onclick="stationModal(${i})">עריכה</button></div>`).join('')}</div>`;
}
function stationModal(i) {
  const s = A.cache.stations.stations[i];
  openModal(esc(s.name), `<label class="f">איפה בדיוק לחכות</label><textarea class="i" id="sn" rows="3" placeholder="למשל: בתחנת האוטובוס מול הכניסה הראשית לקניון, ליד הקיוסק">${esc(s.note)}</textarea>
    <label class="f">קישור למפה (Google Maps / Waze)</label><input class="i" id="sm" dir="ltr" value="${esc(s.mapUrl)}" placeholder="https://maps.app.goo.gl/...">
    <p class="muted small">טיפ: בגוגל מפות לוחצים לחיצה ארוכה על הנקודה המדויקת ← שיתוף ← העתקת קישור.</p>
    <button class="btn block" id="ss">שמירה</button>`, b => {
    $('#ss', b).onclick = e => act(e.target, async () => { await api('saveStation', { session: A.s, name: s.name, note: $('#sn').value, mapUrl: $('#sm').value }); closeModal(); toast('נשמר ✓'); adminSub('stations'); });
  });
}
function subStudents(el, r) {
  const q = A.sq || '';
  const list = r.students.filter(s => !q || (s.name + ' ' + s.group + ' ' + s.phone).includes(q));
  el.innerHTML = `<div class="card"><h2>חניכים רשומים (${r.students.filter(s => s.status === 'active').length})</h2><input class="i" id="sq" placeholder="🔍 חיפוש" value="${esc(q)}">
    ${list.map(s => `<div class="kid"><div class="nm">${esc(s.name)} · ${esc(s.group)} ${s.status === 'pending' ? '<span class="pill warn">ממתין</span>' : ''}<small>${fmtPhone(s.phone)} · ${s.consent ? 'הסכים/ה להצגת מספר' : 'בלי הצגת מספר'}</small></div><button class="btn xs sec" onclick="studentModal('${s.token}')">עריכה</button></div>`).join('')}</div>`;
  const sq = $('#sq'); sq.oninput = () => { A.sq = sq.value; const p = sq.selectionStart; subStudents(el, r); const n = $('#sq'); n.focus(); n.setSelectionRange(p, p); };
}
function studentModal(token) {
  const s = A.cache.students.students.find(x => x.token === token);
  openModal(esc(s.name + ' · ' + s.group), `<label class="f">טלפון</label><input class="i" id="stp" type="tel" value="${esc(s.phone)}">
    <label class="chk"><input type="checkbox" id="stc" ${s.consent ? 'checked' : ''}><span>הסכים/ה להצגת המספר כשהוא/היא אחראי/ת</span></label>
    <button class="btn block" id="sts">שמירה</button>
    <div class="btns c2" style="margin-top:8px"><button class="btn sec" id="str">ניתוק מכשיר</button><button class="btn sec" id="std">מחיקה</button></div>
    <p class="muted small">ניתוק מכשיר: החניך/ה יצטרך/תצטרך להירשם מחדש (למשל אחרי החלפת טלפון). מחיקה: מוחקת את הרישום לגמרי.</p>`, b => {
    $('#sts', b).onclick = e => act(e.target, async () => { await api('saveStudent', { session: A.s, token, phone: $('#stp').value, consent: $('#stc').checked }); closeModal(); toast('נשמר ✓'); adminSub('students'); });
    $('#str', b).onclick = e => { if (confirm('לנתק את המכשיר?')) act(e.target, async () => { await api('resetStudent', { session: A.s, token }); closeModal(); adminSub('students'); }); };
    $('#std', b).onclick = e => { if (confirm('למחוק את הרישום?')) act(e.target, async () => { await api('delStudent', { session: A.s, token }); closeModal(); adminSub('students'); }); };
  });
}
function subHistory(el, r) {
  el.innerHTML = `<div class="card"><h2>ימי הסעות</h2>${r.days.length ? `<table class="t"><tr><th>תאריך</th><th>עלו</th><th>לא הגיעו</th><th>ביטלו</th><th>איחורים</th></tr>${r.days.map(d => `<tr><td>${esc(d.date)}</td><td>${d.on || 0}/${d.total}</td><td>${d.no || 0}</td><td>${d.cancel || 0}</td><td>${d.late || 0}</td></tr>`).join('')}</table>` : '<div class="muted">עוד אין היסטוריה. היא נשמרת כשסוגרים יום.</div>'}</div>
    <div class="card"><h2>חניכים — לא הגיעו / איחרו</h2>${r.kids.filter(k => k.no || k.late).slice(0, 60).map(k => `<div class="spread small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(k.name)} · ${esc(k.group)}</span><span>${k.no ? `<span class="pill bad">${k.no} לא הגיע/ה</span>` : ''} ${k.late ? `<span class="pill warn">${k.late} איחורים</span>` : ''} <span class="muted">מתוך ${k.trips}</span></span></div>`).join('') || '<div class="muted">אין</div>'}</div>
    <div class="card"><h2>פירוט "לא הגיעו"</h2>${r.noShows.slice(0, 80).map(n => `<div class="small" style="padding:3px 0">${esc(n.date)} · <b>${esc(n.name)}</b> ${esc(n.group)} · ${esc(n.line)} / ${esc(n.station)}</div>`).join('') || '<div class="muted">אין</div>'}</div>`;
}
const ACTS = { login: 'כניסה', openDay: 'פתיחת יום', closeDay: 'סגירת יום', replaceDay: 'החלפת גיליון', setLine: 'הגדרת קו', setLineStation: 'תיקון מיקום הסעה', announce: 'הודעה', approve: 'אישור הרשמה', reject: 'דחיית הרשמה', saveUser: 'שמירת משתמש', delUser: 'מחיקת משתמש', saveStudent: 'עריכת חניך', delStudent: 'מחיקת חניך', resetStudent: 'ניתוק מכשיר', saveStation: 'עריכת תחנה', saveSettings: 'הגדרות' };
function subLog(el, r) {
  el.innerHTML = `<div class="card"><h2>יומן פעולות</h2><ul class="list">${r.log.map(l => `<li><div class="spread"><b>${esc(l.user)}</b><span class="muted small">${new Date(l.ts).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></div><div class="small">${ACTS[l.action] || esc(l.action)} <span class="muted">${esc(String(l.details).slice(0, 120))}</span></div></li>`).join('')}</ul></div>`;
}
function subSettings(el, r) {
  const s = r.settings;
  el.innerHTML = `<div class="card"><h2>הגדרות</h2>
    <label class="f">קובץ ההסעות של המדריכים (קישור או מזהה)</label><input class="i" id="sid" dir="ltr" value="${esc(s.SOURCE_ID)}">
    <div class="small" style="margin-top:4px">${s.sourceName ? '✅ מחובר: ' + esc(s.sourceName) : '<span style="color:var(--bad)">❌ ' + esc(s.sourceError) + '</span>'}</div>
    <label class="f">הגיליון מתחיל במילה</label><input class="i" id="stp2" value="${esc(s.TAB_PREFIX)}">
    <button class="btn block" style="margin-top:12px" id="sset">שמירה</button>
    <div class="hr"></div><a href="${esc(s.dataUrl)}" target="_blank">פתיחת קובץ הנתונים של המערכת</a>
    <p class="muted small">קישורים: מסך החניכים — ${esc(APP_URL)} · ניהול — ${esc(APP_URL)}#admin</p></div>`;
  $('#sset').onclick = e => act(e.target, async () => { await api('saveSettings', { session: A.s, SOURCE_ID: $('#sid').value, TAB_PREFIX: $('#stp2').value }); toast('נשמר ✓'); adminSub('settings'); });
}

/* =====================================================================
   הפעלה
   ===================================================================== */
function boot() { closeModal(); pollFn = null; if (location.hash.startsWith('#admin')) adminInit(); else kidInit(); }
window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
